{% extends "base.html" %}
{% import "macros.html" as m %}

{% block content %}
<section class="panel">
  <ol class="index">
    {% for post in posts %}
    <li>
      <time datetime="{{ post.metadata.published }}">{{ post.metadata.published }}</time>
      <a href="/posts/{{ post.stem|urlencode }}">{{ post.metadata.title }}</a>
      <p>{{ post.metadata.description }}</p>
    </li>
    {% endfor %}
  </ol>
</section>
<div class="panel">
  <img
    class="kids"
    src="{{ m.asset("images/look-on-the-bright-side-1280.jpeg") }}"
    srcset="{{ m.asset("images/look-on-the-bright-side-640.jpeg") }} 640w, {{ m.asset("images/look-on-the-bright-side-1280.jpeg") }} 1280w"
    sizes="(min-width: 60rem) 100ch, 100vw"
    alt="kids not in a hall"
    width="1280"
    height="720"
    decoding="async"
  >
</div>
{% endblock %}
